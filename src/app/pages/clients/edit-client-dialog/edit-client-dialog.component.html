<form class="dialog-container" [formGroup]="editClientForm" (ngSubmit)="onSubmit()">
    <div class="logo-container">
        <img src="assets/logo.png" alt="logo" class="logo">
    </div>
    <span>{{'CLIENTS.CLIENTS_DATA' | translate}}</span>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-user"></i>
        </p-inputGroupAddon>
        <input pInputText id="client-name" autocomplete="off" placeholder="{{'CLIENTS.NAME' | translate}}" formControlName="name"/>
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-building"></i>
        </p-inputGroupAddon>
        <input pInputText id="client-company" autocomplete="off" placeholder="{{'CLIENTS.COMPANY' | translate}}" formControlName="company" />
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-dollar"></i>
        </p-inputGroupAddon>
        <input pInputText id="client-price" autocomplete="off" placeholder="{{'CLIENTS.PRICE' | translate}}" formControlName="price" exyNumbersOnly/>
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-cog"></i>
        </p-inputGroupAddon>
        <input pInputText id="yearly-maintenance" autocomplete="off" placeholder="{{'CLIENTS.YEARLY_MAINTENANCE' | translate}}" formControlName="yearly_maintenance" exyNumbersOnly />
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-calendar-clock"></i>
        </p-inputGroupAddon>
        <p-calendar formControlName="payment_date" placeholder="{{'CLIENTS.PAYMENT_DATE' | translate}}" />
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-address-book"></i>
        </p-inputGroupAddon>
        <p-dropdown [options]="statusOptions()" formControlName="status"  placeholder="{{'CLIENTS.STATUS' | translate}}">
            <ng-template pTemplate="item" let-item>
                {{item.label | translate}}
                </ng-template>
                <ng-template let-selectedItem pTemplate="selectedItem">
                {{selectedItem.label | translate}}
            </ng-template>
        </p-dropdown>
    </p-inputGroup>


    <div class="dialog-buttons">
        <p-button label="{{'ACTIONS.CANCEL' | translate}}" severity="secondary" (click)="close()"/>
        <p-button type="submit" label="{{'ACTIONS.SAVE' | translate}}" [disabled]="!editClientForm.valid"/>
    </div>
</form>
