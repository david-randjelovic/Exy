<form class="dialog-container" [formGroup]="editClientForm" (ngSubmit)="onSubmit()">
    <div class="logo-container">
        <img src="assets/logo.png" alt="logo" class="logo">
    </div>
    <span>Clients data:</span>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-user"></i>
        </p-inputGroupAddon>
        <input pInputText id="client-name" autocomplete="off" placeholder="Name" formControlName="name"/>
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-building"></i>
        </p-inputGroupAddon>
        <input pInputText id="client-company" autocomplete="off" placeholder="Company" formControlName="company" />
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-dollar"></i>
        </p-inputGroupAddon>
        <input pInputText id="client-price" autocomplete="off" placeholder="Price" formControlName="price" exyNumbersOnly/>
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-cog"></i>
        </p-inputGroupAddon>
        <input pInputText id="yearly-maintenance" autocomplete="off" placeholder="Yearly Maintenance" formControlName="yearly_maintenance" exyNumbersOnly />
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-calendar-clock"></i>
        </p-inputGroupAddon>
        <p-calendar formControlName="payment_date" placeholder="Payment Date" />
    </p-inputGroup>
    <p-inputGroup>
        <p-inputGroupAddon>
            <i class="pi pi-address-book"></i>
        </p-inputGroupAddon>
        <p-dropdown [options]="options()" formControlName="status"  placeholder="Select status" />
    </p-inputGroup>


    <div class="dialog-buttons">
        <p-button label="Cancel" severity="secondary" (click)="close()"/>
        <p-button type="submit" label="Save"/>
    </div>
</form>
