@if (!router.url.includes('login') && !router.url.includes('register')) {
    @if(screenWidth > 991) { 
        <div class="content-container">
            <exy-sidebar></exy-sidebar>
            <div class="content">
                <exy-header></exy-header>
                <router-outlet></router-outlet>
            </div>
        </div>
    } @else {
        <div class="content">
            <exy-header></exy-header>
            <router-outlet></router-outlet>
        </div>
    }

} @else {
    <router-outlet></router-outlet>
}

<p-toast/>
<exy-spinner></exy-spinner>
